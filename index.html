<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24212c"><meta name="description" content="Vestibulando Geo — estude Geografia para o ENEM e vestibulares.">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Vestibulando Geo">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./logo.svg"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<title>Vestibulando Geo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<aside class="sidebar"><a class="brand" href="#" data-home aria-label="Voltar ao início"><img class="brand-mark" src="logo.svg" alt=""><span>vestibulando<small>GEO</small></span></a>
<nav class="side-nav" aria-label="Navegação principal">
<button class="nav-item active" data-view="jornada"><span>⌁</span>Minha jornada</button><button class="nav-item" data-view="atlas"><span>◎</span>Atlas interativo</button><button class="nav-item" data-view="ao-vivo"><span class="live-nav-dot"></span>Acontecimentos ao vivo</button><button class="nav-item" data-view="questoes"><span>✎</span>Questões de vestibular</button><button class="nav-item" data-view="progresso"><span>↗</span>Meu progresso</button></nav>
</aside>
<main class="main"><header class="topbar"><a class="mobile-brand" href="#" data-home><img class="brand-mark" src="logo.svg" alt=""><strong>Vestibulando Geo</strong></a>
<div class="switch-wrap"><label>ESTUDANDO AGORA</label><button id="switcher" class="switcher" aria-expanded="false"><span id="activeEmoji" class="switch-emoji">🧭</span><span class="switch-copy"><strong id="activeName">Cartografia</strong><small id="activeMeta">Sua jornada de Geografia</small></span><span class="chevron">⌄</span></button><div id="contentMenu" class="content-menu hidden"></div></div>
<div class="top-stats"><div class="pill">🔥 <strong id="streak">0</strong><small>dias</small></div><div class="pill">✦ <strong id="xp">0</strong><small>XP</small></div><button class="avatar" data-view="progresso" aria-label="Meu progresso">↗</button></div></header>
<section id="content" class="view" tabindex="-1"></section></main></div>
<nav class="mobile-nav" aria-label="Navegação móvel"><button class="active" data-view="jornada"><span>⌁</span><small>Jornada</small></button><button data-view="atlas"><span>◎</span><small>Atlas</small></button><button data-view="ao-vivo"><span class="live-nav-dot"></span><small>Ao vivo</small></button><button data-view="questoes"><span>✎</span><small>Questões</small></button><button data-view="progresso"><span>↗</span><small>Progresso</small></button></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="lessons.js"></script>
<script src="script.js"></script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Falha ao registrar o modo offline:', err))); }</script>
</body></html>
