name: Package complete project ZIP
on:
  push:
    branches:
      - ui-polish-splash-streak
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-polish-splash-streak
      - name: Create ZIP
        run: zip -r Vestibulando-Geo-semana-zigzag.zip . -x ".git/*" ".github/*"
      - uses: actions/upload-artifact@v4
        with:
          name: Vestibulando-Geo-semana-zigzag
          path: Vestibulando-Geo-semana-zigzag.zip
          retention-days: 7
