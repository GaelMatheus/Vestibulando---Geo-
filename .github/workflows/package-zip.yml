name: Package complete project ZIP
on:
  push:
    branches:
      - ui-polish-splash-streak
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-polish-splash-streak
      - name: Create ZIP from tracked project files
        run: git archive --format=zip --output=Vestibulando-Geo-semana-zigzag.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Vestibulando-Geo-semana-zigzag
          path: Vestibulando-Geo-semana-zigzag.zip
          retention-days: 7
