name: Export full project ZIP
on:
  push:
    branches:
      - ui-polish-splash-streak
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package complete app
        run: zip -r Vestibulando-Geo-atualizado.zip . -x ".git/*" ".github/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Vestibulando-Geo-atualizado
          path: Vestibulando-Geo-atualizado.zip
          retention-days: 7
